<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DoomTransmit - Compartilhar Tela</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <h1>DoomTransmit</h1>
      <p class="subtitle">
        Compartilhe sua tela e envie o link para quem quiser assistir.
      </p>
      <button id="startBtn" class="btn btn-primary">
        Iniciar compartilhamento
      </button>
    </main>

    <script>
      document.getElementById("startBtn").addEventListener("click", () => {
        const roomId = crypto.randomUUID().replace(/-/g, "").slice(0, 10)
        window.location.href = `/host.html?room=${roomId}`
      })
    </script>
  </body>
</html>
