<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DoomTransmit - Compartilhar Tela</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <h1>DoomTransmit</h1>
      <p class="subtitle">
        Compartilhe sua tela e envie o link para quem quiser assistir.
      </p>
      <button id="startBtn" class="btn btn-primary">
        Iniciar compartilhamento
      </button>
      <p style="margin-top: 20px">
        <a id="logoutLink" href="#" style="color: var(--muted); font-size: 13px"
          >Sair</a
        >
      </p>
    </main>

    <script>
      document.getElementById("startBtn").addEventListener("click", () => {
        // cada usuario tem uma sala fixa propria, definida pelo servidor a partir do login
        window.location.href = "/host.html"
      })

      document
        .getElementById("logoutLink")
        .addEventListener("click", async (event) => {
          event.preventDefault()
          await fetch("/api/logout", { method: "POST" })
          window.location.href = "/login.html"
        })
    </script>
  </body>
</html>
